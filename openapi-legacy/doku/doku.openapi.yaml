  - name: DOKU Direct
    description: DOKU Direct is a collection of REST APIs for customizing your payment flow
  - name: DOKU Direct > Credit Card
  - name: DOKU Direct > Virtual Account
  - name: DOKU Direct > Virtual Account > NON SNAP
  - name: DOKU Direct > Virtual Account > NON SNAP > Mandiri VA
  - name: DOKU Direct > Virtual Account > NON SNAP > BCA VA
  - name: DOKU Direct > Virtual Account > NON SNAP > Bank Syariah Indonesia VA
  - name: DOKU Direct > Virtual Account > NON SNAP > DOKU VA
  - name: DOKU Direct > Virtual Account > NON SNAP > Permata VA
  - name: DOKU Direct > Virtual Account > NON SNAP > CIMB VA
  - name: DOKU Direct > Virtual Account > NON SNAP > BNI VA
  - name: DOKU Direct > Virtual Account > SNAP
  - name: DOKU Direct > Virtual Account > SNAP > BNC SNAP VA
  - name: DOKU Direct > Virtual Account > SNAP > BNI SNAP VA
  - name: DOKU Direct > Virtual Account > SNAP > BRI SNAP VA
  - name: DOKU Direct > Virtual Account > SNAP > BSI SNAP VA
  - name: DOKU Direct > Virtual Account > SNAP > BTN SNAP VA
  - name: DOKU Direct > Virtual Account > SNAP > DANAMON SNAP VA
  - name: DOKU Direct > Virtual Account > SNAP > MANDIRI SNAP VA
  - name: DOKU Direct > Virtual Account > SNAP > MAYBANK SNAP VA
  - name: DOKU Direct > Virtual Account > SNAP > PERMATA SNAP VA
  - name: DOKU Direct > Virtual Account > SNAP > SINARMAS SNAP VA
  - name: DOKU Direct > Virtual Account > SNAP > CIMB SNAP VA
  - name: DOKU Direct > O2O
  - name: DOKU Direct > O2O > Alfa Group
  - name: DOKU Direct > E-Money
  - name: DOKU Direct > E-Money > OVO
  - name: DOKU Direct > E-Money > Shopee Pay
  - name: DOKU Direct > Direct Debit
  - name: DOKU Direct > Direct Debit > BRI Direct Debit
  - name: DOKU Direct > Direct Debit > OVO Snap Direct Debit
    description: >-
      Note :


      - Call the "Misc - Init KJUR" API to import KJUR.
          
      - No need to bind when calling the "Refund" API.
          
      - To get the b2b2c token : copy the "authCode" value from the "Account
      Binding" response and paste it into the "authCode" field in the "Get Token
      B2B2C" request body.
          
      - To unbind : copy the "accessToken" value from the "Get Token B2B2C"
      response and paste it into the "tokenId" field in the "Unbinding" request
      body.
  - name: DOKU Direct > Direct Debit > CIMB Snap Direct Debit
    description: >-
      Note :


      - Call the "Misc - Init KJUR" API to import KJUR.
          
      - To get the b2b2c token : copy the "authCode" value from the "Account
      Binding" response and paste it into the "authCode" field in the "Get Token
      B2B2C" request body.
          
      - To verify OTP : copy the "accessToken" value from the "Get Token B2B2C"
      response and paste it into the "bankCardToken" field in the "Verify OTP
      Payment" or "Verify OTP Unbinding" request body.
          
      - To unbind : copy the "accessToken" value from the "Get Token B2B2C"
      response and paste it into the "tokenId" field in the "Unbinding" request
      body.
  - name: DOKU Direct > Direct Debit > ALLO Snap Direct Debit
    description: >-
      Note :


      - Call the "Misc - Init KJUR" API to import KJUR.
          
      - To get the b2b2c token : copy the "authCode" value from the "Account
      Binding" response and paste it into the "authCode" field in the "Get Token
      B2B2C" request body.
          
      - To unbind : copy the "accessToken" value from the "Get Token B2B2C"
      response and paste it into the "tokenId" field in the "Unbinding" request
      body.
  - name: DOKU Direct > Direct Debit > BRI Snap Direct Debit
    description: >-
      Note :


      - Call the "Misc - Init KJUR" API to import KJUR.
          
      - To get the b2b2c token : copy the "authCode" value from the "Account
      Binding" response and paste it into the "authCode" field in the "Get Token
      B2B2C" request body.
          
      - To resend OTP : copy the "journeyId" value from the "Card Binding" or
      "Payment" request and paste it into the "journeyId" field in the "Request
      OTP Binding" or "Request OTP Payment" request body.
          
      - To verify OTP : copy the "accessToken" value from the "Get Token B2B2C"
      response and paste it into the "bankCardToken" field in the "Verify OTP
      Binding" or "Verify OTP Payment" request body.
          
      - To unbind : copy the "accessToken" value from the "Get Token B2B2C"
      response and paste it into the "tokenId" field in the "Unbinding" request
      body.
  - name: DOKU Direct > Direct Debit > Mandiri Snap Direct Debit
    description: >-
      Note :


      - Call the "Misc - Init KJUR" API to import KJUR.
          
      - To get the b2b2c token : copy the "authCode" value from the "Account
      Binding" response and paste it into the "authCode" field in the "Get Token
      B2B2C" request body.
          
      - To verify OTP : copy the "accessToken" value from the "Get Token B2B2C"
      response and paste it into the "bankCardToken" field in the "Verify OTP
      Binding" or "Verify OTP Payment" request body.
          
      - To unbind : copy the "accessToken" value from the "Get Token B2B2C"
      response and paste it into the "tokenId" field in the "Unbinding" request
      body.
  - name: DOKU Direct > Direct Debit > Dana Snap Direct Debit
    description: |-
      Note :

      - Call the "Misc - Init KJUR" API to import KJUR.
  - name: DOKU Direct > Direct Debit > ShopeePay Snap Direct Debit
    description: |-
      Note :

      - Call the "Misc - Init KJUR" API to import KJUR.
  - name: DOKU Direct > Paylater
  - name: DOKU Direct > Direct Transfer
  - name: DOKU Direct > KKI
  - name: DOKU Checkout
    description: >-
      DOKU Checkout is a Hosted Payment Page that helps you do single
      integration for all payment channels available.
  - name: Misc
  - name: DOKU Sub Account
paths:
  /credit-card/v1/payment-page:
    post:
      tags:
        - DOKU Direct > Credit Card
      summary: CC - Generate Payment Page
      description: >-
        | Header Parameter | Type | Description |

        | --- | --- | --- |

        | Client-Id | `string` | The Client ID you retrieved from Jokul Back
        Office<br>`MANDATORY` |

        | Request-Id | `string` | Random string that must unique per request for
        idempotency<br>`MANDATORY` `ALPHA NUMERIC` `40 chars` |

        | Request-Timestamp | `string` | Request time in ISO8601 format with UTC
        + 0<br>`MANDATORY` |

        | Signature | `string` | Security parameter to ensure the request's
        authenticity. Learn more how to generate Signature
        [here](https://jokul.doku.com/docs/docs/technical-references/generate-signature)<br>`MANDATORY`|
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                order:
                  invoice_number: INV-{{$timestamp}}
                  line_items:
                    - name: DOKU T-Shirt Merah
                      price: 30000
                      quantity: 2
                    - name: DOKU T-Shirt Biru
                      price: 30000
                      quantity: 1
                  amount: 90000
                  callback_url: https://doku.com
                  auto_redirect: false
                  session_id: '0000231223'
                customer:
                  id: W7rbKhPYh76VSHYwHRaGDIbBhgTebgAoWtX
                  name: Anton Budiman
                  email: anton@doku.com
                  phone: '+6281287458232'
                  address: Jakarta, Menara Mulia Lt 8
                  country: ID
                override_configuration:
                  themes:
                    language: ID
                    background_color: ''
                    font_color: ''
                    button_background_color: ''
                    button_font_color: ''
      parameters:
        - name: Client-Id
          in: header
          schema:
            type: string
          example: '{{client_id}}'
        - name: Request-Id
          in: header
          schema:
            type: string
          example: '{{request_id}}'
        - name: Request-Timestamp
          in: header
          schema:
            type: string
          example: '{{request_timestamp}}'
        - name: Signature
          in: header
          schema:
            type: string
          example: '{{signature}}'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
