components:
  schemas:
    AdditionalIPCreatePayload:
      title: AdditionalIPCreatePayload
      required:
        - product_id
        - cycle
      type: object
      properties:
        product_id:
          title: Product Id
          type: integer
        cycle:
          $ref: >-
            #/components/schemas/routers__baremetal_additional_ips__Cycle_options
        region:
          title: Region
          type: string
          default: wjv-1
        promocode:
          title: Promocode
          type: string
          default: ''
        pay_invoice_with_cc:
          allOf:
            - $ref: >-
                #/components/schemas/routers__baremetal_additional_ips__Yes_No_options
          default: 'no'
    AssignToMachinePayload:
      title: AssignToMachinePayload
      required:
        - metal_account_id
      type: object
      properties:
        metal_account_id:
          title: Metal Account Id
          type: integer
    BaremetalCreatePayload:
      title: BaremetalCreatePayload
      required:
        - product_id
        - cycle
        - keypair_id
        - label
        - public_ip
      type: object
      properties:
        product_id:
          title: Product Id
          type: integer
        cycle:
          $ref: '#/components/schemas/routers__baremetals__Cycle_options'
        select_os:
          title: Select Os
          type: string
          default: ubuntu-22
        keypair_id:
          title: Keypair Id
          type: integer
        label:
          title: Label
          maxLength: 16
          minLength: 6
          pattern: ^[a-zA-Z0-9\.\-_\s]*$
          type: string
          example: server-name
        public_ip:
          $ref: '#/components/schemas/Public_IP_options'
        promocode:
          title: Promocode
          type: string
          default: ''
        pay_invoice_with_cc:
          allOf:
            - $ref: '#/components/schemas/routers__baremetals__Yes_No_options'
          default: 'no'
    BaremetalRebuildPayload:
      title: BaremetalRebuildPayload
      type: object
      properties:
        os:
          title: Os
          type: string
          example: centos7-base
    BaremetalUpdateLabelPayload:
      title: BaremetalUpdateLabelPayload
      required:
        - label
      type: object
      properties:
        label:
          title: Label
          maxLength: 16
          minLength: 6
          pattern: ^[a-zA-Z0-9\.\-_\s]*$
          type: string
          example: new label
