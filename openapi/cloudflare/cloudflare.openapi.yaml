    post:
      tags:
        - Load Balancers
      summary: Create Load Balancer
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
        - name: Content-Type
          in: header
          examples:
            Create Load Balancer:
              value: application/json
              x-disabled: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
            examples:
