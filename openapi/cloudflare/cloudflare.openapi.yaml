openapi: 3.1.0
info:
  title: Cloudflare API
  version: 1.0.0
  description: >-
    Here’s a comprehensive and **fully detailed guide** for creating,
    documenting, and using Postman with Cloudflare API. This explanation ensures
    all aspects of the API, including **parameters**, **headers**, **global
    variables**, and request/response structures, are covered.


    ### **1\. Introduction to Postman & Cloudflare API**


    Postman is a tool for API testing, and Cloudflare API allows you to interact
    with Cloudflare services programmatically.


    You will set up:


    - **Environment variables**: To simplify repeated use of authentication
    keys, account IDs, zone IDs, etc.
        
    - **Requests**: These are for all major Cloudflare API endpoints categorized
    by service.
        
    - **Collections**: Organized groups of requests with reusable variables and
    proper documentation.
        

    ### **2\. Setting Up Environment Variables in Postman**


    To streamline API requests, create environment variables:


    1. Go to **Environments** in Postman.
        
    2. Create a new environment named `Cloudflare API`.
        
    3. Add the following variables:
        

    | **Variable Name** | **Example Value** | **Description** |

    | --- | --- | --- |

    | `base_url` | `https://api.cloudflare.com/client/v4` | Base URL for all
    Cloudflare API requests. |

    | `auth_key` | `Bearer` | Your Cloudflare API key for authorization. |

    | `zone_id` |  | Unique identifier for your Cloudflare zone. |

    | `account_id` |  | Your Cloudflare account ID. |

    | `database_id` |  | Unique identifier for your D1 database. |

    | `script_name` | `example-worker` | Worker script name for Cloudflare
    Workers API. |

    | `record_id` |  | Specific DNS record ID for operations like update/delete.
    |

    | `namespace_id` |  | KV namespace ID for KV storage API operations. |
paths:
  /user:
    get:
      tags:
        - Account
      summary: Get User Details
  /accounts:
    get:
      tags:
        - Account
      summary: List Accounts
  /memberships:
    post:
      tags:
        - Account
      summary: Create Account Membership
      parameters:
        - name: Content-Type
          in: header
          examples:
            Create Account Membership:
              value: application/json
              x-disabled: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
            examples:
              Create Account Membership:
                value: '{ "account_id": "example_id", "roles": ["admin"] }'
  /zones:
    get:
      tags:
        - Zone
      summary: List Zones
  /zones/{zone_id}:
    get:
      tags:
        - Zone
      summary: Get Zone Details
      parameters:
        - name: zone_id
          in: path
          required: true
          schema:
            type: string
    delete:
      tags:
        - Zone
      summary: Delete Zone
      parameters:
        - name: zone_id
          in: path
          required: true
          schema:
            type: string
  /zones/{zone_id}/dns_records:
    get:
      tags:
        - DNS
      summary: List DNS Records
      parameters:
        - name: zone_id
          in: path
          required: true
          schema:
            type: string
    post:
      tags:
        - DNS
      summary: Create DNS Record
      parameters:
        - name: zone_id
          in: path
          required: true
          schema:
            type: string
        - name: Content-Type
          in: header
          examples:
            Create DNS Record:
              value: application/json
              x-disabled: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
            examples:
              Create DNS Record:
                value: >-
                  { "type": "A", "name": "example.com", "content": "192.0.2.1",
                  "ttl": 3600 }
  /zones/{zone_id}/dns_records/{record_id}:
    put:
      tags:
        - DNS
      summary: Update DNS Record
      parameters:
        - name: zone_id
          in: path
          required: true
          schema:
            type: string
        - name: record_id
          in: path
          required: true
          schema:
            type: string
        - name: Content-Type
          in: header
          examples:
            Update DNS Record:
              value: application/json
              x-disabled: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
            examples:
              Update DNS Record:
                value: >-
                  { "type": "A", "name": "updated-example.com", "content":
                  "192.0.2.2", "ttl": 3600 }
    delete:
      tags:
        - DNS
      summary: Delete DNS Record
      parameters:
        - name: zone_id
          in: path
          required: true
          schema:
            type: string
        - name: record_id
          in: path
          required: true
          schema:
            type: string
  /zones/{zone_id}/firewall/rules:
    get:
      tags:
        - Firewall
        - Firewall Rules
      summary: List Firewall Rules
      responses: {}
      parameters:
        - name: zone_id
          in: path
          required: true
          schema:
            type: string
          examples: {}
    post:
      tags:
        - Firewall
        - Firewall Rules
      summary: Create Firewall Rule
      responses: {}
      parameters:
        - name: zone_id
          in: path
          required: true
          schema:
            type: string
          examples: {}
        - name: Content-Type
          in: header
          examples:
            'Create Firewall Rule #1':
              value: application/json
              x-disabled: false
            Create Firewall Rule:
              value: application/json
              x-disabled: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
            examples:
              'Create Firewall Rule #1':
                value: >-
                  { "action": "block", "filter": { "expression": "ip.src in
                  {192.0.2.1}" } }
              Create Firewall Rule:
                value: >-
                  { "filter": { "expression": "http.request.uri.path contains
                  '/admin'" }, "action": "block" }
  /accounts/{account_id}/workers/scripts:
    get:
      tags:
        - Workers
      summary: List Worker Scripts
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
  /accounts/{account_id}/workers/scripts/{script_name}:
    put:
      tags:
        - Workers
      summary: Upload Worker Script
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
        - name: script_name
          in: path
          required: true
          schema:
            type: string
        - name: Content-Type
          in: header
          examples:
            Upload Worker Script:
              value: application/javascript
              x-disabled: false
          schema:
            type: string
      requestBody:
        content:
          application/javascript:
            schema:
              type: string
            examples:
              Upload Worker Script:
                value: // Your Worker code here
    delete:
      tags:
        - Workers
      summary: Delete Worker Script
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
        - name: script_name
          in: path
          required: true
          schema:
            type: string
