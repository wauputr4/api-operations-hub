  /zones/{zone_id}/analytics/dashboard:
    get:
      tags:
        - Analytics
      summary: Get Zone Analytics
      parameters:
        - name: zone_id
          in: path
          required: true
          schema:
            type: string
  /accounts/{account_id}/access/apps:
    get:
      tags:
        - Access
      summary: List Access Applications
      parameters:
        - name: account_id
          in: path
          required: true
