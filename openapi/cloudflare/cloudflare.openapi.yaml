  /accounts/{account_id}/workers/durable_objects/namespaces:
    get:
      tags:
        - Durable Objects
      summary: List Durable Objects
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
  /path:
    post:
      tags:
        - Durable Objects
      summary: Send Request to Durable Object
      parameters:
        - name: Content-Type
          in: header
          examples:
            Send Request to Durable Object:
              value: application/json
              x-disabled: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
            examples:
              Send Request to Durable Object:
                value: '{ "key": "value" }'
      servers:
        - url: https://{durable_object_url}
