        - name: namespace_id
          in: path
          required: true
          schema:
            type: string
        - name: key
          in: path
          required: true
          schema:
            type: string
        - name: Content-Type
          in: header
          examples:
            Write KV Pair:
              value: application/json
              x-disabled: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
            examples:
              Write KV Pair:
                value: '{ "value": "example_value" }'
    delete:
      tags:
        - KV Storage
      summary: Delete KV Pair
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
        - name: namespace_id
          in: path
          required: true
          schema:
            type: string
        - name: key
          in: path
          required: true
          schema:
            type: string
  /accounts/{account_id}/d1/databases:
    get:
      tags:
        - D1
      summary: List D1 Databases
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
