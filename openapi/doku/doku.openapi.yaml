    post:
      tags:
        - BNI SNAP VA
      summary: Step 3 -  Create VA (DGPC)
      description: >-
        List of **virtualAccountTrxType**:


        - 1 = C = Closed Payment
            
        - 2 = O = Open Payment
            
        - 3 = I = Partial
            
        - 4 = M = Minimum - Only can be paid once with minimum amount
            
        - 5 = L = Maximum
            
        - 6 = N = Open Minimum - Can be paid multiple with minimum amount
            
        - 7 = X = Open Maximum - Can be paid multiple with cumulative maximum
        amount
            
        - 8 = V = Bill Variable
            
        - 9 = W = Multi Bill Variable
      parameters:
