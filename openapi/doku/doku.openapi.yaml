openapi: 3.1.0
info:
  title: DOKU API Collection
  version: 1.0.0
paths:
  /credit-card/v1/payment-page:
    post:
      tags:
        - Credit Card
      summary: CC - Generate Payment Page
      parameters:
        - name: Client-Id
          in: header
          examples:
            CC - Generate Payment Page:
              value: '{{client_id}}'
              x-disabled: false
          schema:
            type: string
        - name: Request-Id
          in: header
          examples:
            CC - Generate Payment Page:
              value: '{{request_id}}'
              x-disabled: false
          schema:
            type: string
        - name: Request-Timestamp
          in: header
          examples:
            CC - Generate Payment Page:
              value: '{{request_timestamp}}'
              x-disabled: false
          schema:
            type: string
        - name: Signature
          in: header
          examples:
            CC - Generate Payment Page:
              value: '{{signature}}'
              x-disabled: false
          schema:
            type: string
      x-pre-request: >-
        var uuid = require('uuid');

        pm.variables.set("request_id", uuid.v4());

        pm.variables.set("request_timestamp", new Date().toISOString().slice(0,
        19)+"Z");


        function generateSignature(jsonBody) {
            var digestSHA256 = CryptoJS.SHA256(CryptoJS.enc.Utf8.parse(jsonBody));
            var digestBase64 = CryptoJS.enc.Base64.stringify(digestSHA256);
            console.log('Digest Component: ' + jsonBody)
            console.log('Digest sha256: ' + digestSHA256)
            console.log('Digest: ' + digestBase64)
            var signatureComponents = 'Client-Id:' + pm.variables.get('client_id') +'\n'+
            'Request-Id:' + pm.variables.get('request_id') +'\n'+
            'Request-Timestamp:' + pm.variables.get('request_timestamp') + '\n'+
            'Request-Target:/credit-card/v1/payment-page' + '\n'+
            'Digest:' + digestBase64;
            var signatureHmacSha256 = CryptoJS.HmacSHA256(signatureComponents,pm.variables.get('secret_key'));
            var signatureBase64 = CryptoJS.enc.Base64.stringify(signatureHmacSha256);
            console.log('Signature Components: ' + signatureComponents)
            console.log('Signature HMACSHA256: ' + signatureHmacSha256)
            console.log('Signature: ' + signatureBase64)
            return 'HMACSHA256='+signatureBase64;
        }


        pm.variables.set('signature',
        generateSignature(pm.variables.replaceIn(pm.request.body.raw)));
      requestBody:
        content:
          application/json:
            schema:
              type: object
            examples:
              CC - Generate Payment Page:
                value: "{ \n    \"order\": {\n       \t\"invoice_number\":\"INV-{{$timestamp}}\",\n       \t\"line_items\": [\n\t\t\t{\n      \t\t\"name\": \"DOKU T-Shirt Merah\",\n      \t\t\"price\": 30000,\n      \t\t\"quantity\": 2\n    \t\t},\n\t\t\t{\n      \t\t\"name\": \"DOKU T-Shirt Biru\",\n      \t\t\"price\": 30000,\n      \t\t\"quantity\": 1\n    \t\t}\n  \t\t],\n       \t\"amount\": 90000,\n       \t\"callback_url\": \"https://doku.com\",\n       \t\"auto_redirect\": false,\n       \t\"session_id\": \"0000231223\"\n    },\n    \"customer\": {\n    \t\"id\":\"W7rbKhPYh76VSHYwHRaGDIbBhgTebgAoWtX\",\n    \t\"name\":\"Anton Budiman\",\n    \t\"email\":\"anton@doku.com\",\n    \t\"phone\":\"+6281287458232\",\n\t\t\"address\":\"Jakarta, Menara Mulia Lt 8\",\n\t\t\"country\":\"ID\"\n\t},\n    \"override_configuration\": {\n        \"themes\": {\n            \"language\": \"ID\",\n            \"background_color\": \"\",\n            \"font_color\": \"\",\n            \"button_background_color\": \"\",\n            \"button_font_color\": \"\"\n        }\n    }\n}"
