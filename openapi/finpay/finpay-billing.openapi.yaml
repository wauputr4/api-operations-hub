      x-pre-request: "// --- Inquiry ---\nconst moment = require('moment');\r\n\r\nvar userName = pm.globals.get(\"userName\");\r\nvar password = pm.globals.get(\"userPass\");\r\n\r\nvar bodyRaw = pm.request.body\r\nvar obj = JSON.parse(bodyRaw)\r\n\r\n\r\nvar date = Date.now()\r\ntimestamp = moment().format(\"DD-MM-YYYY HH:mm:ss:Z\")\r\n\r\n\r\nvar sha256Param = CryptoJS.SHA256(timestamp+password).toString()\r\nvar signatureToParse = userName+\r\n                obj.productCode+\r\n                obj.channel+\r\n                obj.terminal+\r\n                obj.transactionType+\r\n                obj.billNumber+\r\n                date+\r\n                sha256Param\r\n\r\nvar signature = CryptoJS.SHA256(signatureToParse).toString()\r\n\r\npm.environment.set(\"userName\", userName)\r\npm.environment.set(\"signature\", signature)\r\npm.environment.set(\"timestamp\", timestamp)\r\npm.environment.set(\"traxId\", date)\n\n// --- Payment ---\nconst moment = require('moment');\r\n\r\nvar userName = pm.globals.get(\"userName\");\r\nvar password = pm.globals.get(\"userPass\");\r\n\r\nvar bodyRaw = pm.request.body\r\nvar obj = JSON.parse(bodyRaw)\r\n\r\nvar date = Date.now()\r\ntimestamp = moment().format(\"DD-MM-YYYY HH:mm:ss:Z\")\r\n\r\n\r\nvar sha256Param = CryptoJS.SHA256(timestamp+password).toString()\r\nvar signatureToParse = userName+\r\n                obj.productCode+\r\n                obj.channel+\r\n                obj.terminal+\r\n                obj.transactionType+\r\n                obj.billNumber+\r\n                date+\r\n                sha256Param\r\n\r\nvar signature = CryptoJS.SHA256(signatureToParse).toString()\r\n\r\npm.environment.set(\"userName\", userName)\r\npm.environment.set(\"signature\", signature)\r\npm.environment.set(\"timestamp\", timestamp)\r\npm.environment.set(\"traxId\", date)\r\n\r\nconsole.log(sha256Param)\r\nconsole.log(signatureToParse)"
