openapi: 3.1.0
info:
  title: Flip for Business API
  version: 1.0.0
  description: >-
    Docs-derived Postman collection for core Flip for Business API endpoints.
    Source:
    https://beta-docs-flip.netlify.app/docs/api/flip-for-business-api-documentation
    and https://docs.flip.id/docs/postman-collection/.
paths:
  /v2/general/balance:
    get:
      summary: Deposit balance
      description: Retrieve the current Flip account balance in Rupiah (IDR).
      responses:
        '200':
          description: Successful response
  /v2/general/banks:
    get:
      summary: List of Bank
      description: Return bank codes and bank availability information.
      responses:
        '200':
          description: Successful response
  /v2/disbursement/bank-account-inquiry:
    post:
      summary: Bank Account Inquiry
      description: Get the bank account holder name before creating a disbursement.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                account_number:
                  type: string
                bank_code:
                  type: string
              required:
                - account_number
                - bank_code
            examples:
              Bank Account Inquiry:
                value:
                  - key: account_number
                    value: '1234567890'
                    type: text
                  - key: bank_code
                    value: bca
                    type: text
      responses:
        '200':
          description: Successful response
  /v3/disbursement:
    post:
      summary: Create Disbursement
      description: Create a common disbursement transaction.
      parameters:
        - name: idempotency-key
          in: header
          examples:
            Create Disbursement:
              value: '{{idempotency_key}}'
              x-disabled: false
          schema:
            type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                account_number:
                  type: string
                bank_code:
                  type: string
                amount:
                  type: integer
                remark:
                  type: string
              required:
                - account_number
                - bank_code
                - amount
            examples:
              Create Disbursement:
                value:
                  - key: account_number
                    value: '1234567890'
                    type: text
                  - key: bank_code
                    value: bca
                    type: text
                  - key: amount
                    value: '10000'
                    type: text
                  - key: remark
                    value: Invoice payout
                    type: text
      responses:
        '200':
          description: Successful response
    get:
      summary: Get All Disbursement
      description: Get the paginated list of disbursement transactions.
      parameters:
        - name: pagination
          in: query
          examples:
            Get All Disbursement:
              value: 20
              x-disabled: false
          schema:
            type: integer
        - name: page
          in: query
          examples:
            Get All Disbursement:
              value: 1
              x-disabled: false
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
  /v3/get-disbursement:
    get:
      summary: Get Disbursement by ID or Idempotency Key
      description: Get one specific disbursement transaction by id or idempotency key.
      parameters:
        - name: id
          in: query
          examples:
            Get Disbursement by ID or Idempotency Key:
              value: '{{idempotency_key}}'
              x-disabled: false
          schema:
            type: string
      responses:
        '200':
          description: Successful response
  /v2/pwf/bill:
    post:
      summary: Create Bill
      description: Create a payment/bill link.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                title:
                  type: string
                type:
                  type: string
                amount:
                  type: integer
                expired_date:
                  type: string
                step:
                  type: integer
              required:
                - title
                - type
                - amount
                - step
            examples:
              Create Bill:
                value:
                  - key: title
                    value: Invoice payment
                    type: text
                  - key: type
                    value: SINGLE
                    type: text
                  - key: amount
                    value: '10000'
                    type: text
                  - key: expired_date
                    value: 2026-12-31 23:59
                    type: text
                  - key: step
                    value: '3'
                    type: text
      responses:
        '200':
          description: Successful response
    get:
      summary: Get All Bills
      description: Get all existing payment links.
      parameters:
        - name: pagination
          in: query
          examples:
            Get All Bills:
              value: 20
              x-disabled: false
          schema:
            type: integer
        - name: page
          in: query
          examples:
            Get All Bills:
              value: 1
              x-disabled: false
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
  /v2/pwf/{bill_id}/bill:
    get:
      summary: Get Bill / Payment Link
      description: Get a specific payment link.
      parameters:
        - name: bill_id
          in: path
          required: true
          schema:
            type: string
          description: Flip payment link identifier.
      responses:
        '200':
          description: Successful response
  /v2/pwf/{bill_id}/payment:
    get:
      summary: Get Payment
      description: Get payment transactions from a specific bill link.
      parameters:
        - name: bill_id
          in: path
          required: true
          schema:
            type: string
          description: Flip payment link identifier.
      responses:
        '200':
          description: Successful response
  /v2/pwf/payment:
    get:
      summary: Get All Payment
      description: Get all existing payment transactions.
      parameters:
        - name: pagination
          in: query
          examples:
            Get All Payment:
              value: 20
              x-disabled: false
          schema:
            type: integer
        - name: page
          in: query
          examples:
            Get All Payment:
              value: 1
              x-disabled: false
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
  /v2/international-disbursement/exchange-rates:
    get:
      summary: Get Exchanges Rate
      description: Get exchange rates and destination corridor transfer details.
      parameters:
        - name: currency
          in: query
          examples:
            Get Exchanges Rate:
              value: USD
              x-disabled: false
          schema:
            type: string
      responses:
        '200':
          description: Successful response
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
security:
  - basicAuth: []
servers:
  - url: https://bigflip.id/big_sandbox_api
