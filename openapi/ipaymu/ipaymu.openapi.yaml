        - name: Accept
          in: header
          examples:
            Request Pickup:
              value: application/json
              x-disabled: false
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                transaction_id:
                  type: string
                  description: |
                    <p>iPaymu transaction id</p>
                  example: '16158750'
                pickup_date:
                  type: string
                  description: |
                    <p>pickup date (format Y-m-d on WIB)</p>
                  example: '2024-07-10'
                pickup_time:
                  type: string
                  description: |
                    <p>pickup time (format H:i on WIB)</p>
                  example: '14:00'
                pickup_vehicle:
                  type: string
                  description: |
                    <ul>
                    <li>Motor</li>
                    <li>Mobil</li>
                    </ul>
                  example: Motor
            examples:
              Request Pickup:
                value:
                  - key: transaction_id
                    value: '16158750'
                    description: |
                      <p>iPaymu transaction id</p>
                    type: text
                  - key: pickup_date
                    value: '2024-07-10'
                    description: |
                      <p>pickup date (format Y-m-d on WIB)</p>
                    type: text
                  - key: pickup_time
                    value: '14:00'
                    description: |
                      <p>pickup time (format H:i on WIB)</p>
                    type: text
                  - key: pickup_vehicle
                    value: Motor
                    description: |
                      <ul>
                      <li>Motor</li>
                      <li>Mobil</li>
                      </ul>
                    type: text
