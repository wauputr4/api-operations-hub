              x-disabled: false
          schema:
            type: string
        - name: Accept
          in: header
          examples:
            Shipping Calculate:
              value: application/json
              x-disabled: false
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                destination_area_id:
                  type: string
                  example: '17473'
                pickup_area_id:
                  type: string
                  example: '17473'
                weight:
                  type: string
                  description: |
                    <p>in kilogram</p>
                  example: '1'
                amount:
                  type: string
                  example: '100000'
            examples:
              Shipping Calculate:
                value:
                  - key: destination_area_id
                    value: '17473'
                    type: text
                  - key: pickup_area_id
                    value: '17473'
                    type: text
                  - key: weight
                    value: '1'
                    description: |
                      <p>in kilogram</p>
                    type: text
                  - key: amount
                    value: '100000'
