    post:
      tags:
        - Payment
      summary: Callback Params (Success, Pending, and, Expired Transaction)
      description: >-
        <h3 id="ipaymu-callback-documentation"><strong>iPaymu Callback
        Documentation</strong></h3>

        <p>Callback parameters will be sent when the buyer successfully makes
        the payment.</p>

        <p><strong>Configuration:</strong><br />You can configure the Callback
        Content-Type (<code>application/x-www-form-urlencoded</code> or
        <code>application/json</code>) in your dashboard settings:</p>

        <ul>

        <li><p><strong>Production:</strong> <a
        href="https://my.ipaymu.com/integration/setting">https://my.ipaymu.com/integration/setting</a></p>

        </li>

        <li><p><strong>Sandbox:</strong> <a
        href="https://sandbox.ipaymu.com/integration/setting">https://sandbox.ipaymu.com/integration/setting</a></p>

        </li>

        </ul>

        <p><strong>Notes:</strong></p>

        <ul>

        <li><p>Callback is automatically re-sent if we don't get <code>http
        response 200</code>.</p>

        </li>

        <li><p>Make sure to validate when receiving callbacks more than 1 time
        not to update your transaction.</p>

        </li>

        <li><p><strong>Signature Validation:</strong> To verify the request is
        truly from iPaymu, validate the <code>signature</code> parameter.</p>

        </li>

        <li><p><strong>Secret Key:</strong> Use your <strong>iPaymu Merchant VA
        (Virtual Account)</strong> number as the <code>$secretKey</code>.</p>

        </li>

        <li><p><strong>Mechanism:</strong></p>

        </li>

        </ul>

        <ol>

        <li><p>Remove the <code>signature</code> parameter from the received
        data.</p>

        </li>

        <li><p>Sort the data by keys in <strong>ascending order</strong>
        (<code>ksort</code>).</p>

        </li>

        <li><p>Convert the sorted data to a JSON string.</p>

        </li>

        <li><p>Generate the <strong>HMAC-SHA256</strong> hash using the JSON
        string and your Secret Key (VA).</p>

        </li>

        <li><p>Compare your generated signature with the received signature.</p>

        </li>

        </ol>

        <p>=======================================================================</p>

        <h3 id="dokumentasi-callback-ipaymu"><strong>Dokumentasi Callback
        iPaymu</strong></h3>

        <p>Parameter callback akan dikirimkan saat pembeli berhasil melakukan
        pembayaran.</p>

        <p><strong>Konfigurasi:</strong><br />Anda dapat mengatur Tipe Konten
        Callback (<code>application/x-www-form-urlencoded</code> atau
        <code>application/json</code>) melalui pengaturan dashboard:</p>

        <ul>

        <li><p><strong>Production:</strong> <a
        href="https://my.ipaymu.com/integration/setting">https://my.ipaymu.com/integration/setting</a></p>

        </li>

        <li><p><strong>Sandbox:</strong> <a
        href="https://sandbox.ipaymu.com/integration/setting">https://sandbox.ipaymu.com/integration/setting</a></p>

        </li>

        </ul>

        <p><strong>Catatan:</strong></p>

        <ul>

        <li><p>Callback secara otomatis dikirim ulang jika kami tidak
        mendapatkan <code>http response 200</code>.</p>

        </li>

        <li><p>Pastikan melakukan validasi saat menerima callback lebih dari 1
        kali untuk tidak memperbarui status transaksi Anda ke berhasil
        (mensukseskan transaksi).</p>

        </li>

        <li><p><strong>Validasi Signature:</strong> Untuk memverifikasi bahwa
        request benar-benar dari iPaymu, validasi parameter
        <code>signature</code>.</p>

        </li>

        <li><p><strong>Secret Key:</strong> Gunakan <strong>nomor VA Merchant
        iPaymu (Virtual Account)</strong> Anda sebagai
        <code>$secretKey</code>.</p>

        </li>

        <li><p><strong>Mekanisme:</strong></p>

        </li>

        </ul>

        <ol>

        <li><p>Hapus parameter <code>signature</code> dari data yang
        diterima.</p>

        </li>

        <li><p>Urutkan data berdasarkan kunci (key) secara
        <strong>ascending</strong> (<code>ksort</code>).</p>

        </li>

        <li><p>Konversi data yang sudah diurutkan menjadi string JSON.</p>

        </li>

        <li><p>Generate hash <strong>HMAC-SHA256</strong> menggunakan string
        JSON tersebut dan Secret Key (VA) Anda.</p>

        </li>

        <li><p>Bandingkan signature hasil generate Anda dengan signature yang
        diterima.</p>

        </li>

        </ol>

        <h4 id="example-code-signature-validation-php"><strong>Example Code:
        Signature Validation (PHP)</strong></h4>

        <p><strong>1. PHP</strong></p>

        <pre class="click-to-expand-wrapper is-snippet-wrapper"><code
        class="language-php">// Nomor VA iPaymu Anda

        $secretKey = '117000xxxxxx'; 

        // 1. Ambil Data Masuk (Mendukung JSON atau Form-Data sesuai setting
        dashboard)

        $input = file_get_contents('php://input');

        $data  = json_decode($input, true) ?? $_POST;

        // 2. Pisahkan signature yang diterima

        $receivedSignature = $data['signature'] ?? '';

        unset($data['signature']); [cite_start]// [cite: 29]

        // 3. Urutkan data berdasarkan key (Ascending A-Z)

        ksort($data); [cite_start]// [cite: 31]

        // 4. Generate Signature

        $jsonBody = json_encode($data); [cite_start]// [cite: 33]

        $calculatedSignature = hash_hmac('sha256', $jsonBody, $secretKey);
        [cite_start]// [cite: 33]

        // 5. Bandingkan

        [cite_start]if (hash_equals($calculatedSignature, $receivedSignature)) {
        // [cite: 35]
            // Signature Valid. Proses transaksi update database.
            echo json_encode(['status' =&gt; 'success']);
        } else {
            // Signature Tidak Valid. Abaikan.
            http_response_code(400);
        }

        ?&gt;


        </code></pre>

        <p><strong>2. Node.js (Express)</strong></p>

        <pre class="click-to-expand-wrapper is-snippet-wrapper"><code
        class="language-javascript">const crypto = require('crypto');

        const express = require('express');

        const app = express();

        // Middleware untuk handle JSON dan URL-encoded

        app.use(express.json());

        app.use(express.urlencoded({ extended: true }));

        app.post('/callback', (req, res) =&gt; {
            const secretKey = '117000xxxxxx'; // Nomor VA iPaymu Anda
            // 1. Ambil Data
            let data = req.body;
            // 2. Pisahkan signature yang diterima
            const receivedSignature = data.signature;
            delete data.signature; // Hapus signature agar tidak ikut di-hash
            // 3. Urutkan object berdasarkan key (Meniru PHP ksort)
            const sortedKeys = Object.keys(data).sort();
            const sortedData = {};
            sortedKeys.forEach(key =&gt; {
                sortedData[key] = data[key];
            });
            // 4. Generate Signature
            const jsonBody = JSON.stringify(sortedData);
            const calculatedSignature = crypto
                .createHmac('sha256', secretKey)
                .update(jsonBody)
                .digest('hex');
            // 5. Bandingkan
            if (calculatedSignature === receivedSignature) {
                // Valid
                console.log('Transaksi Terverifikasi');
                res.status(200).json({ status: 'OK' });
            } else {
                // Tidak Valid
                console.error('Signature Salah');
                res.status(400).send('Invalid Signature');
            }
        });


        </code></pre>

        <p><strong>Source:</strong></p>

        <p><a
        href="https://drive.google.com/file/d/1WfBEI5ry6V7knuSiCONYC4ZhQmD8Aipn/view">https://drive.google.com/file/d/1WfBEI5ry6V7knuSiCONYC4ZhQmD8Aipn/view</a></p>
      responses:
