openapi: 3.1.0
info:
  title: iPaymu Public API v2
  version: 1.0.0
  description: >-
    <html><head></head><body><ul>

    <li><p>Url Live/Production: <a
    href="https://my.ipaymu.com"><b>https://my.ipaymu.com</b></a></p>

    </li>

    <li><p>Url Development/Sandbox: <a
    href="https://sandbox.ipaymu.com"><b>https://sandbox.ipaymu.com</b></a></p>

    </li>

    </ul>

    <p><strong>Sample Generate Signature:</strong></p>

    <ul>

    <li><p>PHP (<a
    href="https://github.com/putuedi/ipaymu-payment-v2-sample-php">https://github.com/ipaymu/ipaymu-payment-v2-sample-php</a>)</p>

    </li>

    <li><p>NodeJS (<a
    href="https://github.com/putuedi/ipaymu-payment-v2-sample-nodejs">https://github.com/ipaymu/ipaymu-payment-v2-sample-nodejs</a>)</p>

    </li>

    <li><p>Python (<a
    href="https://github.com/putuedi/ipaymu-payment-v2-sample-python">https://github.com/ipaymu/ipaymu-payment-v2-sample-python</a>)</p>

    </li>

    <li><p>Golang (<a
    href="https://github.com/putuedi/ipaymu-payment-v2-sample-go">https://github.com/ipaymu/ipaymu-payment-v2-sample-go</a>)</p>

    </li>

    <li><p>Dotnet C# (<a
    href="https://github.com/putuedi/ipaymu-payment-v2-sample-dotnet">https://github.com/ipaymu/ipaymu-payment-v2-sample-dotnet</a>)</p>

    </li>

    <li><p>Ruby (<a
    href="https://github.com/ipaymu/ipaymu-payment-v2-sample-ruby">https://github.com/ipaymu/ipaymu-payment-v2-sample-ruby</a>)</p>

    </li>

    <li><p>Java (<a
    href="https://github.com/ipaymu/ipaymu-payment-v2-sample-java">https://github.com/ipaymu/ipaymu-payment-v2-sample-java</a>)</p>

    </li>

    </ul>

    <p><strong>Catatan:</strong></p>

    <ul>

    <li><p>VA dan Api Key bisa didapatkan pada menu Integrasi di dashboard
    iPaymu Anda.</p>

    </li>

    <li><p>VA dan Api Key Mode Sandbox/Development berbeda dengan VA dan Api Key
    Mode Production/Live.</p>

    </li>

    <li><p>Jika mendapatkan kendala integrasi silakan hubungi <a
    href="https://mailto:support@ipaymu.com"><b>support@ipaymu.com</b></a> atau
    WhatsApp <a href="https://wa.link/p8vnr7">https://wa.link/p8vnr7</a></p>

    </li>

    </ul>

    <p><strong>Notes:</strong></p>

    <p>• VA and Api Key can be found in the Integration menu on your iPaymu
    dashboard.<br>• VA and Api Key Mode Sandbox/Development are different with
    VA and Api Key Mode Production/Live.<br>• If you have problem for
    integration, please contact <a
    href="https://mailto:support@ipaymu.com">support@ipaymu.com</a> or via
    WhatsApp <a href="https://wa.link/p8vnr7">https://wa.link/p8vnr7</a></p>

    </body></html>
