                    type: text
  /api/v2/cod/pickup:
    post:
      tags:
        - Direct Payment COD
      summary: Request Pickup
      description: <p>Pickup COD</p>
      parameters:
        - name: va
          in: header
          examples:
            Request Pickup:
              value: '1179000899'
              x-disabled: false
          schema:
            type: integer
        - name: signature
          in: header
