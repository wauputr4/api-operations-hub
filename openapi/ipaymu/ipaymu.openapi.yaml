          schema:
            type: integer
      x-pre-request: >-
        const apikey = pm.variables.get('apiKey') //ipaymu apikey

        const va = pm.variables.get('va')


        // Mengambil semua parameter query dari request

        const queryParams = pm.request.url.query.all();


        // Membuat objek untuk menyimpan parameter query

        const queryParamsObj = {};

        queryParams.forEach(param => {
            queryParamsObj[param.key] = param.value;
        });


        // Mengubah objek parameter query menjadi string JSON

        const reqJson = JSON.stringify(queryParamsObj);



        // Generate signature

        const bodyEncrypt  = require('crypto-js').SHA256(reqJson);

        const stringtosign = pm.request.method+":"+va+":"+bodyEncrypt+":"+apikey

        const signature    =
        require('crypto-js').enc.Hex.stringify(require('crypto-js').HmacSHA256(stringtosign,
        apikey))


        pm.environment.set("signature",signature)


        console.log(`request: ${reqJson}`)

        console.log(`stringToSign: ${stringtosign}`)

        console.log(`signature: ${signature}`)
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties: {}
            examples:
