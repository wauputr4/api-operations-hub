          in: path
          required: true
          schema:
            type: string
          description: iPaymu COD transaction identifier.
        - name: va
          in: header
          examples:
            Download Label:
              value: '1179000899'
              x-disabled: false
          schema:
            type: integer
        - name: signature
          in: header
