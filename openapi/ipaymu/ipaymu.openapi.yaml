tags:
  - name: Payment
    description: >
      <img
      src="https://content.pstmn.io/fa658247-507e-44b9-9fe5-318368d54779/cGF5bWVudC1pcGF5bXUtZmxvdy5qcGc="
      />


      <p><strong>Unauthorized Credential</strong></p>

      <ul>

      <li><p><strong>Error Message:</strong> <code>unauthorized</code>,
      <code>401</code></p>

      </li>

      <li><p><strong>Description:</strong> Usually happens when using wrong
      credentials or mixing sandbox and production credentials</p>

      </li>

      <li><p><strong>Solutions:</strong> Ensure you're using the correct VA and
      API Key for the environment (sandbox vs production)</p>

      </li>

      </ul>

      <p><strong>Unauthorized Signature</strong></p>

      <ul>

      <li><p><strong>Error Message:</strong> <code>{"Message":"unauthorized
      signature"}</code>, <code>401</code></p>

      </li>

      <li><p><strong>Description:</strong> Can be caused by illegal characters
      that interfere with signature generation (like ` or special quotes) or
      sending data with null values</p>

      </li>

      <li><p><strong>Solutions:</strong> Remove special characters from
      parameters, ensure no null values, verify signature generation process</p>

      </li>

      </ul>

      <p><strong>Invalid Domain</strong></p>

      <ul>

      <li><p><strong>Error Message:</strong> <code>invalid domain</code>,
      <code>406</code></p>

      </li>

      <li><p><strong>Description:</strong> Occurs when return url, cancel url,
      or notify url are not registered in the dashboard</p>

      </li>

      <li><p><strong>Solutions:</strong> Register all domains in your iPaymu
      dashboard; for production, domains need activation</p>

      </li>

      <li><p><strong>Reference:</strong> <a
      href="https://blog.ipaymu.com/mengatasi-masalah-error-invalid-ip-domain-di-ipaymu/">https://blog.ipaymu.com/mengatasi-masalah-error-invalid-ip-domain-di-ipaymu/</a></p>

      </li>

      </ul>

      <p><strong>Production IP &amp; Domain Requirements</strong></p>

      <ul>

      <li><p><strong>IP Check:</strong> Production has IP validation - user
      needs static IP registered to dashboard</p>

      </li>

      <li><p><strong>Domain Activation:</strong> Multiple domains can be
      registered but require activation request</p>

      </li>

      <li><p><strong>Outgoing IP:</strong> Ensure registered IP is the one
      making requests to iPaymu</p>

      </li>

      <li><p><strong>Domain Validation:</strong> URLs must be registered and
      activated in dashboard for production use</p>

      </li>

      </ul>
  - name: Direct Payment COD
    description: Part of Payment
