          description: >-
            (Required) Timestamp for the non-repudiation signature. Format must
            be yyyy-MM-ddTHH:mm:ssTZD.
          examples:
            Create Payout:
              value: '2022-09-24T15:32:00Z'
              x-disabled: false
          schema:
