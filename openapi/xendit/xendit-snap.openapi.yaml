openapi: 3.1.0
info:
  title: API-Xendit SNAP
  version: 1.0.0
paths:
  /snap/v1.0/utilities/asymmetric-signature-service:
    post:
      tags:
        - Utility APIs (Test mode only)
      summary: Generate Asymmetric Signature
      description: >-
        Asymmetric Signature API allow you to generate signature for all Xendit
        SNAP APIs. The purpose of this API is to simulate signature generation,
        and will work in Test mode only. For API integration, you MUST generate
        the signature NOT by calling this API, but by calculating the signature
        based on SNAP algorithm. [Documentation
        here](https://xendit.stoplight.io/docs/api-webhook-signature/branches/main/ghau5r7abzpjg-signature-and-key-exchange#signature-and-key-exchange)


        You will need the following information to generate signature


        - \[Header\] X-TIMESTAMP, timestamp of the request in ISO8601 format.
        Example 2022-08-31T06:00:00Z

        - \[Header\] Private_key, this is your RSA 2048 format in Xendit

        - \[Header\] httpmethod, which is the HTTP Method on the API you want to
        use

        - \[Header\] endpointurl, which is the relative URL of the API path you
        want to use

        - \[Body\] Request body is the request body of the API you want to use
        and sign (must be in JSON format)
            

        You will get `signature` value which you could attach to `X-SIGNATURE`
        header on the API you want to use
      parameters:
        - name: X-CLIENT-KEY
          in: header
          examples:
            Generate Asymmetric Signature:
              value: '{{client-id}}'
              x-disabled: false
          schema:
            type: string
        - name: Private_Key
          in: header
          examples:
            Generate Asymmetric Signature:
              value: '{{private-key}}'
              x-disabled: false
          schema:
            type: string
        - name: X-TIMESTAMP
          in: header
          examples:
            Generate Asymmetric Signature:
              value: '2023-01-06T12:24:00+07:00'
              x-disabled: false
          schema:
            type: string
        - name: endpointurl
          in: header
          examples:
            Generate Asymmetric Signature:
              value: /snap/v1.0/transfer-va/inquiry-va
              x-disabled: false
          schema:
            type: string
        - name: httpmethod
          in: header
          examples:
            Generate Asymmetric Signature:
              value: POST
              x-disabled: false
          schema:
            type: string
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
            examples:
              Generate Asymmetric Signature:
                value: "{\r\n  \"trxId\": \"demo_test-0320943981575\"\r\n}"
      servers:
        - url: https://api.xendit.co
