  /v2/accounts:
    post:
      tags:
        - xenPlatform
      summary: Create Account V2
      description: >-
        The Create Account API allows you to create Accounts for your Partners
        that are linked to your Platform. Once an Account is created, you may
        accept payments on its behalf. Additionally, you can route payments
        to/from the Account via the Transfers API or Platform fee API.


        There are two types of Accounts that can be created: `MANAGED`, `OWNED`.
        Review our documentation for recommendations on which Account type to
        use for your business model.


        `MANAGED` Accounts provide your Partners with full-fledged Xendit
        Accounts that your Platform can transact on behalf of. Your Partners may
        register their Account via an invitation email is sent to the `email`.
        Thereafter, your Partners login to their own Xendit dashboard to
        complete the onboarding process.


        `OWNED` Accounts are invisible to your Partners and fully controlled by
        you. You may transact on behalf of an `OWNED` Account once they have
        been created using payment methods that have been enabled on your
        Platform.


        Note for `OWNED` Accounts: Newly activated payment methods and changes
        made to Callback URLs on the Platform do not automatically change for
        existing `OWNED` accounts. We recommend activating all relevant payment
        methods and setting up your Callback URLs before creating `OWNED`
        Accounts. Alternatively, contact us when you need to make a change.


        Store the returned account `id` value to make transactions for that
        Account in the future.
      parameters:
        - name: Content-Type
          in: header
          examples:
            Create Account V2:
              value: application/json
              x-disabled: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
            examples:
              Create Account V2:
                value: |-
                  {
                      "email": "angie@pinkpanther.com",
                      "type": "OWNED",
                      "public_profile": {
                          "business_name": "Retail Business 1"
                      }
                  }
  /v2/accounts/{id}:
