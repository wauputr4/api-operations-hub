  /split_rules:
    post:
      tags:
        - xenPlatform
      summary: Create Split Rule
      description: >-
        The Platform Fee feature allows you to automatically charge a fee when
        creating a payment on behalf of your sub-account. Use this feature to
        collect fees for the transactions that you accept on behalf of your
        Partners.


        A Fee Rule Object defines how payments accepted on behalf of a
        sub-account are routed by xenPlatform. Include the `fee_rule_id`
        returned in the response in supported transaction endpoints - Invoices,
        eWallets - to automatically charge a Platform fee once payments settle.


        *Note: Fees are transferred from your sub-accounts at 15 minute
        intervals once your transaction has settled. As such, you may find that
        there is up to 15 minute delay from when settlement occurs, to when the
        Platform fee is deducted.*
      requestBody:
        content:
          application/json:
            schema:
              type: object
            examples:
              Create Split Rule:
                value: "{\r\n    \"name\": \"Standard platform fee\",\r\n    \"description\": \"Platform fee for all transactions accepted on behalf of vendors\",\r\n    \"routes\": [\r\n        {\r\n            \"flat_amount\": 3000,\r\n            \"currency\": \"IDR\",\r\n            \"destination_account_id\": \"5f8d0c0603ffe06b7d4d9fcf\",\r\n            \"reference_id\": \"reference1\"\r\n        },\r\n        {\r\n            \"percent_amount\": 5.25,\r\n            \"currency\": \"IDR\",\r\n            \"destination_account_id\": \"5cafeb170a2b18519b1b8768\",\r\n            \"reference_id\": \"reference2\"\r\n        }\r\n    ]\r\n}"
  /fee_rules:
    post:
      tags:
        - xenPlatform
      summary: '[Deprecated] Create Fee Rule'
      description: >-
        The Platform Fee feature allows you to automatically charge a fee when
        creating a payment on behalf of your sub-account. Use this feature to
        collect fees for the transactions that you accept on behalf of your
        Partners.


        A Fee Rule Object defines how payments accepted on behalf of a
        sub-account are routed by xenPlatform. Include the `fee_rule_id`
