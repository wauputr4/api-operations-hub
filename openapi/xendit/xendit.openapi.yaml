  /linked_account_tokens/auth:
    post:
      tags:
        - Direct Debit
      summary: Binding - Initiate Account Authorization
      description: >-
        Account linking is required before performing direct debits. 


        Account authorizations are represented by linked account tokens. This
        endpoint initializes the authorization process and linked account token
        creation.
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
                examples:
                  - application/json
          content:
            application/json:
              schema:
                type: string
              examples:
                default:
                  id: d290f1ee-6c54-4b01-90e6-d701748f0851
                  customer_id: d290f1ee-6c54-4b01-90e6-d701748f0851
                  channel_code: <string>
                  status: <string>
                  type: <string>
                  authorizer_url: <string>
      parameters:
        - name: Content-Type
          in: header
          examples:
            Binding - Initiate Account Authorization:
              value: application/json
              x-disabled: false
          schema:
            type: string
      x-pre-request: |-
        function generateValidCardExpiry() {
            const currentDate = new Date();
            currentDate.setFullYear(currentDate.getFullYear() + 1)

            const formattedMonth = ('0' + (currentDate.getMonth() + 1)).slice(-2);
            const formattedYear = currentDate.getFullYear().toString().substr(2,2);    
            
            return `${formattedMonth}/${formattedYear}`
        }

        pm.environment.set("valid_card_expiry", generateValidCardExpiry());
      x-post-response: |-
        pm.test("Status code is 200", function () {
            pm.response.to.have.status(200);
        });

        var jsonData = pm.response.json();
        pm.environment.set("normal_linked_account_token_id", jsonData.id);
      requestBody:
        content:
          application/json:
            schema:
              type: object
            examples:
              Binding - Initiate Account Authorization:
                value: "{\n    \"customer_id\": \"test_customer_reference_id\",\n    \"channel_code\": \"DC_BRI\",\n    \"properties\": {\n\t    \"account_mobile_number\": \"+6287779944444\",\n\t    \"card_last_four\": \"8888\",\n\t    \"card_expiry\": \"11/23\",\n\t    \"account_email\": \"test.email@xendit.co\"\n    }\n}"
  /linked_account_tokens/{linked_account_token_id}/validate_otp:
    post:
      tags:
        - Direct Debit
      summary: Binding - Validate OTP for Linked Account Token
      description: >-
        Account linking for BRI requires an OTP to proceed.


        Upon successful initialization, the bank will send an OTP to the
        customer's registered mobile number directly. This endpoint validates
        the OTP with the bank.
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
                examples:
                  - application/json
          content:
            application/json:
              schema:
                type: string
              examples:
                default:
                  id: d290f1ee-6c54-4b01-90e6-d701748f0851
                  customer_id: d290f1ee-6c54-4b01-90e6-d701748f0851
                  channel_code: <string>
                  status: <string>
                  type: <string>
                  authorizer_url: <string>
      parameters:
        - name: linked_account_token_id
          in: path
          examples:
            Binding - Validate OTP for Linked Account Token:
              value: ''
              x-disabled: false
          required: true
          schema:
            type: string
        - name: Content-Type
          in: header
          examples:
            Binding - Validate OTP for Linked Account Token:
              value: application/json
              x-disabled: false
          schema:
            type: string
      x-pre-request: |-
        function generateValidCardExpiry() {
            const currentDate = new Date();
            currentDate.setFullYear(currentDate.getFullYear() + 1)

            const formattedMonth = ('0' + (currentDate.getMonth() + 1)).slice(-2);
            const formattedYear = currentDate.getFullYear().toString().substr(2,2);    
            
            return `${formattedMonth}/${formattedYear}`
        }

        pm.environment.set("valid_card_expiry", generateValidCardExpiry());
      x-post-response: |-
        pm.test("Status code is 200", function () {
            pm.response.to.have.status(200);
        });
      requestBody:
        content:
          application/json:
            schema:
              type: object
            examples:
              Binding - Validate OTP for Linked Account Token:
                value: |-
                  {
                      "otp_code": "460046"
                  }
