  /recurring_payments:
    post:
      tags:
        - Direct Debit
        - xenPlatform
      summary: Payment - Recurring Payments
      description: >-
        Recurring payments allow you to use the auto debit feature in direct
        debit to pull funds from your customers bank account on a scheduled
        basis.


        Currently only supported for BRI Direct Debit.


        You may also create a Recurring payment request on behalf of your
        sub-accounts.


        The value in this field should include the full `user_id` of a
        sub-account that has previously been created by you.


        This example demonstrates how to create a disbursement for a sub-account
        using the Create Recurring Payment API.


        Note that for the Create Recurring Payment API, the response will
        provide you with a confirmation that the invoice was created for the
        correct sub-account `user_id`.


        Please refer to the [Xendit API
        reference](https://xendit.github.io/apireference/) for all supported
        APIs.
      responses:
        '200':
          description: OK
          content:
            application/json: {}
      parameters:
        - name: Content-Type
          in: header
          examples:
            '[EXAMPLE] Create Recurring Payment for Sub-account Request':
              value: application/json
              x-disabled: false
          schema:
            type: string
        - name: for-user-id
          in: header
          examples:
