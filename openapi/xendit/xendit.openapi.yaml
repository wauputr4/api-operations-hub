  /customers:
    post:
      tags:
        - eWallet / Link and Pay
        - Create Customer - Step 1
        - Paylater
        - Direct Debit
        - Recurring
      summary: Create Customer
      description: >-
        A customer object is required in order to link a payment method for
        direct debit. This allows you to easily link and track payment methods
        and transactions.
      responses:
        '200':
          description: OK
          content:
            application/json: {}
      parameters:
        - name: API-VERSION
          in: header
          examples:
            'Create Customer #1':
              value: '2020-10-31'
              x-disabled: false
          schema:
            type: string
        - name: api-version
          in: header
          examples:
            Create Paylater Customer:
              value: '2020-05-19'
              x-disabled: false
          schema:
            type: string
        - name: API-Version
          in: header
          examples:
            Create Customer:
              value: '2020-10-31'
              x-disabled: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
            examples:
              'Create Customer #1':
                value: |-
                  {
                      "reference_id": "{{$randomUUID}}",
                      "mobile_number": "+628888811111",
                      "email": "merchant@xendit.co",
                      "type" : "INDIVIDUAL",
                      "individual_detail": {
                          "given_names": "Mlon Eusk"
                          }
                  }
              Binding - Create Customer:
                value: "{\n\t\"given_names\": \"postman_given_names\",\n\t\"reference_id\": \"test_customer_reference_id\",\n\t\"email\": \"testemail@email.com\"\n}"
              Create Paylater Customer:
                value: "{\n\t\"given_names\": \"Harry\",\n    \"surname\":\"Potter\",\n    \"email\": \"customer@domain.co\",\n    \"mobile_number\": \"+628123456789\",\n    \"reference_id\": \"Hogwarts\",\n    \"addresses\": [{\n        \"street_line1\": \"Jalan Makan\",\n        \"city\": \"Jakarta Pusat\",\n        \"province\": \"Daerah Khusus Ibukota Jakarta\",\n        \"postal_code\": \"12160\",\n            \"country\": \"ID\"\n    }]\n}"
              ShopeePay PH Tokenized - Create Customer Copy 2:
                value: "{\r\n\t\"reference_id\": \"mock-reference-id-{{$timestamp}}\",\r\n\t\"email\": \"testemail@email.com\",\r\n\t\"given_names\": \"John Doe\"\r\n}\r\n"
              Create Customer:
                value: |-
                  {
                      "reference_id": "demo-{{$randomUUID}}",
                      "type": "INDIVIDUAL",
                      "individual_detail": {
                          "given_names": "John",
                          "surname": "Doe"
                      },
                      "email": "testemail@email.com",
                      "mobile_number": "+628774494404"
                  }
      x-pre-request: >-
        // --- Binding - Create Customer ---

        var uuid = require('uuid');


        pm.environment.set("normal_customer_reference_id", "myreference-" +
        uuid.v4());
      x-post-response: |-
        // --- Binding - Create Customer ---
        pm.test("Status code is 200", function () {
            pm.response.to.have.status(200);
        });

        var jsonData = pm.response.json();
        pm.environment.set("preparation_customer_id", jsonData.id);
