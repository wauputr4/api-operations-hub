      description: >-
        Create a single debit to pull funds from the end customer's account
        using an active payment method.
      responses:
        '202':
          description: Accepted
          content:
            application/json: {}
      parameters:
        - name: idempotency-key
          in: header
          examples:
            Payment - One Time Payment w OTP:
              value: '{{normal_direct_debit_reference_id}}'
              x-disabled: false
          schema:
            type: string
      x-pre-request: >-
        var uuid = require('uuid');


        pm.environment.set("normal_direct_debit_reference_id", "payment-" +
        uuid.v4());
      x-post-response: >-
        pm.test("Status code is 202", function () {
            pm.response.to.have.status(202);
        });


        pm.test("PENDING status", function () {
            var jsonData = pm.response.json();

            pm.expect(jsonData.status).to.eql('PENDING');
        });


        pm.test("OTP required", function () {
            var jsonData = pm.response.json();

            pm.expect(jsonData.is_otp_required).to.eql(true);
        });


        var jsonData = pm.response.json();

        pm.environment.set("dd_payment_with_otp", jsonData.id);

        pm.environment.set("dd_payment_with_otp_reference_id",
        pm.environment.get('normal_direct_debit_reference_id'));

        pm.environment.set("dd_payment_with_otp_amount", jsonData.amount);
      requestBody:
        content:
          application/json:
            schema:
              type: object
            examples:
              Payment - One Time Payment w OTP:
                value: |-
                  {
                      "reference_id": "{{normal_direct_debit_reference_id}}",
                      "payment_method_id": "{{debit_card_payment_method_id}}",
                      "currency": "IDR",
                      "amount": 1688,
                      "enable_otp": true,
                      "callback_url": "https://yourwebhooksite"
                  }
