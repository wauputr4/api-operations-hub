              value: 5d0c9bfa72667f2212d8f602
              x-disabled: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
            examples:
              Set Callback URL:
                value: |-
                  {
                      "url": "https://www.xendit.co"
                  }
