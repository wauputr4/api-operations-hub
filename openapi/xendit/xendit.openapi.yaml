  /v2/invoices:
    post:
      tags:
        - Invoices
        - xenPlatform
      summary: Create Invoice w/ FVA
      description: >-
        [[API Reference] - Create
        Invoice](https://xendit.github.io/apireference/#create-invoices)


        [[Xendit Docs] - Invoices](https://docs.xendit.co/xeninvoice/)


        Once a sub-account has been created, you may make transactions for them
        by simply including a `for-user-id` field in the header of your request
        to any Xendit API.


        The value in this field should include the full `user_id` of a
        sub-account that has previously been created by you.


        This example demonstrates how to create an invoice for a sub-account
        using the Create Invoice API.


        Note that for the Create Invoice API, the response will provide you with
        a confirmation that the invoice was created for the correct sub-account
        `user_id`.


        Please refer to the [Xendit API
        reference](https://xendit.github.io/apireference/) for all supported
        APIs.
      responses: {}
      parameters:
        - name: Content-Type
          in: header
          examples:
            '[EXAMPLE] Creating an Invoice for a Sub-account':
              value: application/json
              x-disabled: false
            Create Invoice w/ FVA:
              value: application/json
              x-disabled: false
          schema:
            type: string
        - name: for-user-id
          in: header
          examples:
            '[EXAMPLE] Creating an Invoice for a Sub-account':
              value: 5d0c9bfa72667f2212d8f602
              x-disabled: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
            examples:
              '[EXAMPLE] Creating an Invoice for a Sub-account':
                value: "{\n\t\"external_id\": \"invoice_on_behalf_of_shop1\",\n\t\"description\": \"For Shirt sold by Shop 1\",\n\t\"amount\": 10000,\n\t\"payer_email\": \"john_doe@xendit.co\",\n\t\"should_send_email\": true\n}"
              Create Invoice w/ FVA:
                value: "{\n\t\"external_id\": \"invoice_fva-{{$timestamp}}\",\n\t\"amount\": 50000,\n\t\"payer_email\": \"customer@domain.com\",\n\t\"description\": \"Invoice-{{$timestamp}}\",\n\t\"callback_virtual_account_id\": \"5bdaa2a8aec237552b1d547b\"\n}"
