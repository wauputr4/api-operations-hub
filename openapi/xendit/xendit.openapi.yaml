              value: 5cafed486b901f526e2ba04c
              x-disabled: false
          schema:
            type: string
        - name: idempotency-key
          in: header
          examples:
            Payment - Recurring Payments:
              value: '{{dd_payment_with_otp_reference_id}}'
              x-disabled: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
            examples:
              '[EXAMPLE] Create Recurring Payment for Sub-account Request':
                value: "{\n\t\"external_id\": \"recurring_on_behalf_of_Shop1\",\n\t\"payer_email\": \"john_doe@xendit.co\",\n\t\"description\": \"Please pay your monthly subscription fee\",\n\t\"amount\": 100000,\n\t\"interval\": \"MONTH\",\n\t\"interval_count\": \"1\",\n\t\"should_send_email\": true\n}"
              Payment - Recurring Payments:
                value: "{\n\t\"external_id\": \"albert\",\n\t\"payer_email\": \"albert@xendit.co\",\n\t\"description\": \"description\",\n\t\"payment_method_id\": \"{{debit_card_payment_method_id}}\",\n\t\"amount\": 15000,\n\t\"interval\": \"DAY\",\n\t\"interval_count\": 1\t\n}"
