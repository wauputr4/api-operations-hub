        // --- Payment - Recurring Payments ---

        var uuid = require('uuid');


        pm.environment.set("normal_direct_debit_reference_id", "myreference-" +
        uuid.v4());
      x-post-response: |-
        // --- Payment - Recurring Payments ---
        pm.test("Status code is 200", function () {
            pm.response.to.have.status(200);
        });

        pm.test("PENDING status", function () {
            var jsonData = pm.response.json();

            pm.expect(jsonData.payment_method_id).to.eql(pm.environment.get('debit_card_payment_method_id'));
        });

        var jsonData = pm.response.json();
        pm.environment.set("recurring_with_payment_method_id", jsonData.id);
