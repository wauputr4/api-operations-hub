  /callback_urls/{type}:
    post:
      tags:
        - xenPlatform
      summary: Set Callback URL
      description: >-
        The Set Callback URLs API allows you to set your sub-accounts' Callback
        URLs.


        Use your production key to set production URLs; use your development key
        to set development URLs.


        Note: Production callback URLs have to use the HTTPs protocol.



        The following can be used in the `:type` query parameter.

        1. `invoice`: When an invoice is paid, our systems will send a callback
        to the URL

        2. `disbursement`: When a disbursement is sent, our systems will send a
        callback to the URL

        3. `fva_status`: When a FVA is created or updated, our systems will send
        a callback to the URL

        4. `fva_paid`: When a FVA is paid, our systems will send a callback to
        the URL
      parameters:
        - name: type
          in: path
          examples:
            Set Callback URL:
              value: ''
              x-disabled: false
          required: true
          schema:
            type: string
        - name: Content-Type
