        - name: before_id
          in: query
          examples:
            List Payment Requests:
              value: ''
              x-disabled: true
          schema:
            type: integer
          x-scalar-disabled: true
    post:
      tags:
        - Payment Request
      summary: Open Amount multiple use
      requestBody:
        content:
          application/json:
            schema:
              type: object
            examples:
              Open Amount multiple use:
                value: |-
                  {
                      "currency": "IDR",
                      "amount": null,
                      "payment_method": {
                          "type": "VIRTUAL_ACCOUNT",
                          "reusability": "MULTIPLE_USE",
                          "reference_id": "pm-level-{{$randomUUID}}",
                          "virtual_account": {
                              "channel_code": "BRI",
                              "channel_properties": {
                                  "customer_name": "John Doe"
                              }
                          }
                      },
                      "metadata": {
                          "sku": "ABCDEFGH"
                      }
                  }
  /v2/payment_methods/{id}:
    get:
      tags:
        - General
        - Tokenized - Account Linking
        - Unlinking with Confirmation - TH - KTB
      summary: Check Payment Status
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
                examples:
                  - no-store, no-cache, must-revalidate, proxy-revalidate
            Content-Encoding:
              schema:
                type: string
                examples:
                  - gzip
            Content-Type:
              schema:
                type: string
                examples:
                  - application/json; charset=utf-8
            Date:
              schema:
                type: string
                examples:
                  - Tue, 06 Apr 2021 06:23:48 GMT
            Etag:
              schema:
                type: string
                examples:
                  - W/"10c-K+CPO4qjjUd0CHG8AL2l9bMvcaQ"
            Expires:
              schema:
                type: string
                examples:
                  - '0'
            Pragma:
              schema:
                type: string
                examples:
                  - no-cache
            Server:
              schema:
                type: string
                examples:
                  - nginx
            Strict-Transport-Security:
              schema:
                type: string
                examples:
                  - max-age=2592000; includeSubDomains
            Surrogate-Control:
              schema:
                type: string
                examples:
                  - no-store
            Content-Length:
              schema:
                type: string
                examples:
                  - '219'
            Connection:
              schema:
                type: string
                examples:
                  - keep-alive
            X-CDN:
              schema:
                type: string
                examples:
                  - Imperva
            X-Iinfo:
              schema:
                type: string
                examples:
                  - >-
                    12-48646183-48384082 pNNN RT(1617689888703 337845) q(0 0 0
                    -1) r(11 11) U16
          content:
            application/json:
              schema:
                type: string
              examples:
