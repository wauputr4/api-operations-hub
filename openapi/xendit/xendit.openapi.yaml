      tags:
        - xenPlatform
      summary: Get Account V2
      description: >-
        Use the GET Account endpoint to retrieve the details of a single Account
        that has been created on or linked to your Platform.


        You may poll this endpoint to get information like: i) the status of the
        Account and whether real-money payments can be created on its behalf,
        ii) the public information that is displayed when payments are created.
      parameters:
        - name: id
          in: path
          examples:
            Get Account V2:
              value: ''
              x-disabled: false
          required: true
          schema:
            type: string
        - name: Content-Type
          in: header
          examples:
            Get Account V2:
              value: application/json
              x-disabled: false
          schema:
            type: string
