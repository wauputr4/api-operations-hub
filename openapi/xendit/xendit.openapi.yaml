              value: ''
              x-disabled: false
          required: true
          schema:
            type: string
        - name: Content-Type
          in: header
          examples:
            Link Account Holder:
              value: application/json
              x-disabled: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
            examples:
              Link Account Holder:
                value: |-
                  {
                      "account_holder_id": "4376b7b0-1c44-46be-8640-828f79cdc8be"
                  }
